<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>黒にんにく管理</title>
  <link rel="stylesheet" href="./styles.css?v=20260914-five-series">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://eight-corp.github.io/garlic-liff-scanner/shared/business-auth.js?v=20260912-black-garlic-menu"></script>
  <script src="./config.js"></script>
</head>
<body class="login-locked">
  <section id="loginPanel" class="login-screen">
    <div class="login-card">
      <h1>黒にんにく管理</h1>
      <p id="loginMessage" class="notice" role="status">ログイン状態を確認しています。</p>
      <a href="https://eight-corp.github.io/garlic-liff-scanner/menu.html?openExternalBrowser=1">メニューに戻る</a>
    </div>
  </section>

  <header class="app-header">
    <div class="header-row">
      <h1>黒にんにく管理</h1>
      <div class="worker-bar">
        <div class="current-worker"><strong id="currentWorker"></strong><span id="currentRole"></span></div>
        <button id="menuBtn" type="button" class="secondary header-btn" title="メニューに戻る"><i data-lucide="house"></i><span>メニュー</span></button>
        <button id="reloadBtn" type="button" class="secondary header-btn" title="更新"><i data-lucide="refresh-cw"></i><span>更新</span></button>
        <button id="logoutBtn" type="button" class="secondary header-btn" title="ログアウト"><i data-lucide="log-out"></i><span>ログアウト</span></button>
      </div>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="機能">
      <button type="button" class="tab active" data-tab="main"><i data-lucide="clipboard-pen-line"></i><span>出庫・入庫</span></button>
      <button type="button" class="tab" data-tab="storage"><i data-lucide="warehouse"></i><span>保管庫</span></button>
      <button type="button" class="tab" data-tab="summary"><i data-lucide="table-2"></i><span>集計</span></button>
      <button type="button" class="tab" data-tab="prediction"><i data-lucide="chart-line"></i><span>グラフ</span></button>
      <button type="button" class="tab" data-tab="master"><i data-lucide="settings-2"></i><span>マスタ</span></button>
    </nav>

    <section id="mainPanel" class="panel active-panel" data-panel="main">
      <div class="section-title">
        <h2>出庫・入庫入力</h2>
        <span id="mainStatus" class="notice"></span>
      </div>
      <form id="mainForm" class="form-grid main-form-grid">
        <input id="mainEntryId" type="hidden">
        <div class="main-input-row main-key-row">
          <label class="main-date-field">
            <span class="field-label">日付<span id="mainDateWeekday" class="weekday-inline"></span></span>
            <input id="mainDate" type="date" required>
          </label>
          <label>種別<select id="mainType" required></select></label>
          <label>室名<select id="mainRoom" required></select></label>
          <label>温度<input id="mainTemperature" type="number" step="0.1" inputmode="decimal"></label>
        </div>
        <div class="main-input-row main-quantity-row">
          <label>出庫<input id="mainOut" type="number" step="0.01" min="0" inputmode="decimal"></label>
          <label>入庫<input id="mainIn" type="number" step="0.01" min="0" inputmode="decimal"></label>
          <label>空き<input id="mainEmpty" type="number" step="0.01" min="0" inputmode="decimal"></label>
          <label>在庫<input id="mainInventory" type="number" step="0.01" min="0" inputmode="decimal" placeholder="自動" title="空欄なら自動計算"></label>
          <label class="main-note-field">備考<textarea id="mainNote" rows="1"></textarea></label>
        </div>
        <div class="action-row wide">
          <button id="mainSubmitBtn" type="submit"><i data-lucide="save"></i><span>登録</span></button>
          <button id="mainClearBtn" type="button" class="secondary"><i data-lucide="eraser"></i><span>入力クリア</span></button>
        </div>
      </form>

      <div class="section-title compact">
        <h2>履歴</h2>
      </div>
      <div class="history-controls main-history-controls">
        <label>
          <span class="field-label">履歴表示日<span id="mainHistoryDateWeekday" class="weekday-inline"></span></span>
          <input id="mainHistoryDate" type="date">
        </label>
        <button id="mainPrevDateBtn" type="button" class="icon-btn secondary" title="前日"><i data-lucide="chevron-left"></i></button>
        <button id="mainNextDateBtn" type="button" class="icon-btn secondary" title="翌日"><i data-lucide="chevron-right"></i></button>
        <label>種別<select id="mainHistoryType"></select></label>
      </div>
      <div id="mainHistory" class="table-wrap main-history-wrap"></div>
    </section>

    <section id="storagePanel" class="panel" data-panel="storage">
      <div class="section-title">
        <h2>保管庫入力</h2>
        <span id="storageStatus" class="notice"></span>
      </div>
      <form id="storageForm" class="form-grid storage-form-grid">
        <input id="storageEntryId" type="hidden">
        <label>
          <span class="field-label">日付<span id="storageDateWeekday" class="weekday-inline"></span></span>
          <input id="storageDate" type="date" required>
        </label>
        <label>種別<select id="storageType" required></select></label>
        <label>16段<input id="storageColumns" type="number" step="1" min="0" inputmode="numeric"></label>
        <label>端数<input id="storagePieces" type="number" step="1" min="0" inputmode="numeric"></label>
        <label>備考<textarea id="storageNote" rows="1"></textarea></label>
        <div class="action-row wide">
          <button type="submit"><i data-lucide="save"></i><span>登録</span></button>
          <button id="storageClearBtn" type="button" class="secondary"><i data-lucide="eraser"></i><span>入力クリア</span></button>
        </div>
      </form>
      <div class="section-title compact"><h2>履歴</h2></div>
      <div class="history-controls main-history-controls storage-history-controls">
        <label>
          <span class="field-label">履歴表示日<span id="storageHistoryDateWeekday" class="weekday-inline"></span></span>
          <input id="storageHistoryDate" type="date">
        </label>
        <button id="storagePrevDateBtn" type="button" class="icon-btn secondary" title="前日"><i data-lucide="chevron-left"></i></button>
        <button id="storageNextDateBtn" type="button" class="icon-btn secondary" title="翌日"><i data-lucide="chevron-right"></i></button>
        <label>種別<select id="storageHistoryType"></select></label>
      </div>
      <div id="storageHistory" class="table-wrap"></div>
    </section>

    <section id="summaryPanel" class="panel" data-panel="summary">
      <div class="section-title">
        <h2>集計</h2>
        <button id="summaryPrintBtn" type="button" class="secondary"><i data-lucide="printer"></i><span>印刷</span></button>
      </div>
      <div class="summary-controls main-summary-controls">
        <div class="summary-date-controls">
          <label for="summaryStartDate" class="field-label">集計開始日<span id="summaryStartDateWeekday" class="weekday-inline"></span></label>
          <input id="summaryStartDate" type="date">
          <button id="summaryPrevDateBtn" type="button" class="icon-btn secondary" title="前日" aria-label="前日"><i data-lucide="chevron-left"></i></button>
          <button id="summaryNextDateBtn" type="button" class="icon-btn secondary" title="翌日" aria-label="翌日"><i data-lucide="chevron-right"></i></button>
        </div>
        <label id="summaryTypeFilter">種別<select id="summaryType"></select></label>
        <label id="summaryRoomFilter">室名<select id="summaryRoom"></select></label>
        <button id="summaryRefreshBtn" type="button" class="icon-btn" title="更新" aria-label="更新"><i data-lucide="refresh-cw"></i></button>
      </div>
      <fieldset id="summaryMetricControls" class="summary-metric-controls">
        <legend>表示項目</legend>
        <div class="summary-metric-options">
          <label><input type="radio" name="summaryMetric" value="out" checked><span>出庫数</span></label>
          <label><input type="radio" name="summaryMetric" value="in"><span>入庫数</span></label>
          <label><input type="radio" name="summaryMetric" value="empty"><span>空き</span></label>
          <label><input type="radio" name="summaryMetric" value="inventory"><span>在庫</span></label>
        </div>
      </fieldset>
      <div id="weeklySummary" class="summary-view active"></div>
      <div id="weeklyStorageSummary" class="summary-view"></div>
      <div id="monthlySummary" class="summary-view"></div>
      <div id="monthlyStorageSummary" class="summary-view"></div>
      <div id="summaryGraph" class="summary-view graph-view">
        <div class="actual-graph-toolbar">
          <div class="summary-controls actual-graph-filters">
            <label>種別<span class="graph-select-input"><select id="graphType"></select><i data-lucide="chevron-down" aria-hidden="true"></i></span></label>
            <label>室名<span class="graph-select-input"><select id="graphRoom"></select><i data-lucide="chevron-down" aria-hidden="true"></i></span></label>
          </div>
          <div class="summary-controls graph-controls">
            <label>開始日<span class="graph-date-input"><input id="graphStartDate" type="date"><span class="graph-date-display" aria-hidden="true"><span id="graphStartDateText"></span><i data-lucide="calendar"></i></span></span></label>
            <label>終了日<span class="graph-date-input"><input id="graphEndDate" type="date"><span class="graph-date-display" aria-hidden="true"><span id="graphEndDateText"></span><i data-lucide="calendar"></i></span></span></label>
            <button id="graphRefreshBtn" type="button" class="icon-btn" title="更新" aria-label="更新"><i data-lucide="refresh-cw"></i></button>
            <button id="graphFullscreenBtn" type="button" class="icon-btn secondary" title="全画面表示" aria-label="全画面表示"><i data-lucide="maximize-2"></i></button>
          </div>
        </div>
        <div class="graph-series-controls">
          <label class="graph-in-series"><span class="graph-series-label"><span class="graph-series-swatch" aria-hidden="true"></span>入庫</span><select id="graphInType"><option value="line">折れ線</option><option value="bar" selected>棒グラフ</option></select></label>
          <label class="graph-out-series"><span class="graph-series-label"><span class="graph-series-swatch" aria-hidden="true"></span>出庫</span><select id="graphOutType"><option value="line">折れ線</option><option value="bar" selected>棒グラフ</option></select></label>
          <label class="graph-inventory-series"><span class="graph-series-label"><span class="graph-series-swatch" aria-hidden="true"></span>在庫</span><select id="graphInventoryType"><option value="line">折れ線</option><option value="bar">棒グラフ</option></select></label>
        </div>
        <div class="chart-box"><canvas id="summaryChart" role="img" aria-label="入庫・出庫・在庫の推移"></canvas></div>
      </div>
      <div id="storageGraphSummary" class="summary-view graph-view">
        <h2 id="storageGraphPrintTitle" class="print-title storage-graph-print-title"></h2>
        <div class="storage-graph-toolbar">
          <div class="summary-controls graph-controls">
            <label>開始日<span class="graph-date-input"><input id="storageGraphStartDate" type="date"><span class="graph-date-display" aria-hidden="true"><span id="storageGraphStartDateText"></span><i data-lucide="calendar"></i></span></span></label>
            <label>終了日<span class="graph-date-input"><input id="storageGraphEndDate" type="date"><span class="graph-date-display" aria-hidden="true"><span id="storageGraphEndDateText"></span><i data-lucide="calendar"></i></span></span></label>
            <button id="storageGraphRefreshBtn" type="button" class="icon-btn" title="更新" aria-label="更新"><i data-lucide="refresh-cw"></i></button>
            <button id="storageGraphFullscreenBtn" type="button" class="icon-btn secondary" title="全画面表示" aria-label="全画面表示"><i data-lucide="maximize-2"></i></button>
          </div>
        </div>
        <div class="graph-series-controls storage-graph-series-controls">
          <div class="storage-series-1">
            <label class="storage-graph-series-kind"><span class="graph-series-swatch" aria-hidden="true"></span><select id="storageGraphType" aria-label="保管種別1 全体固定" disabled><option value="All">全体</option></select></label>
            <select id="storageGraphStyle" aria-label="全体の表示形式"><option value="line">折れ線</option><option value="bar">棒</option></select>
          </div>
          <div class="storage-series-2">
            <label class="storage-graph-series-kind"><span class="graph-series-swatch" aria-hidden="true"></span><select id="storageGraphType2" aria-label="保管種別2"></select><i data-lucide="chevron-down" aria-hidden="true"></i></label>
            <select id="storageGraphStyle2" aria-label="系列2の表示形式"><option value="line">折れ線</option><option value="bar">棒</option></select>
          </div>
          <div class="storage-series-3">
            <label class="storage-graph-series-kind"><span class="graph-series-swatch" aria-hidden="true"></span><select id="storageGraphType3" aria-label="保管種別3"></select><i data-lucide="chevron-down" aria-hidden="true"></i></label>
            <select id="storageGraphStyle3" aria-label="系列3の表示形式"><option value="line">折れ線</option><option value="bar">棒</option></select>
          </div>
          <div class="storage-series-4">
            <label class="storage-graph-series-kind"><span class="graph-series-swatch" aria-hidden="true"></span><select id="storageGraphType4" aria-label="保管種別4"></select><i data-lucide="chevron-down" aria-hidden="true"></i></label>
            <select id="storageGraphStyle4" aria-label="系列4の表示形式"><option value="line">折れ線</option><option value="bar">棒</option></select>
          </div>
          <div class="storage-series-5">
            <label class="storage-graph-series-kind"><span class="graph-series-swatch" aria-hidden="true"></span><select id="storageGraphType5" aria-label="保管種別5"></select><i data-lucide="chevron-down" aria-hidden="true"></i></label>
            <select id="storageGraphStyle5" aria-label="系列5の表示形式"><option value="line">折れ線</option><option value="bar">棒</option></select>
          </div>
        </div>
        <p id="storageGraphStatus" class="graph-capacity-status" role="status" hidden></p>
        <div class="chart-box"><canvas id="storageSummaryChart" role="img" aria-label="保管庫の保管数の推移"></canvas></div>
      </div>
      <nav class="sub-tabs summary-bottom-tabs" aria-label="集計表示の切り替え">
        <button type="button" class="sub-tab active" data-summary-view="weekly">週毎<span>(室)</span></button>
        <button type="button" class="sub-tab" data-summary-view="weeklyStorage">週毎<span>(保管庫)</span></button>
        <button type="button" class="sub-tab" data-summary-view="monthly">月毎<span>(室)</span></button>
        <button type="button" class="sub-tab" data-summary-view="monthlyStorage">月毎<span>(保管庫)</span></button>
        <button type="button" class="sub-tab" data-summary-view="graph">グラフ<span>(室)</span></button>
        <button type="button" class="sub-tab" data-summary-view="storageGraph">グラフ<span>(保管庫)</span></button>
      </nav>
    </section>

    <section id="predictionPanel" class="panel" data-panel="prediction">
      <div class="section-title">
        <h2>グラフ</h2>
        <button id="graphPrintBtn" type="button" class="secondary"><i data-lucide="printer"></i><span>印刷</span></button>
      </div>
      <div id="forecastGraphs" class="graph-view active">
        <div class="summary-controls prediction-controls">
          <label>開始日<input id="predictionStartDate" type="date"></label>
          <label>終了日<input id="predictionEndDate" type="date"></label>
          <label>種別<select id="predictionType"></select></label>
          <label>室名<select id="predictionRoom"></select></label>
          <label>日平均使用列数<input id="avgUsage" type="number" step="0.01" min="0" inputmode="decimal"></label>
          <button id="predictionRefreshBtn" type="button" class="icon-btn" title="更新" aria-label="更新"><i data-lucide="refresh-cw"></i></button>
        </div>
        <p class="hint">在庫数は16枚で1列、端数は枚数です。出庫予測は出庫数2で1枚、16枚で1列として保管列に換算します。日平均使用列数は日曜日を除いて差し引きます。</p>
        <div class="sub-tabs">
          <button type="button" class="sub-tab" data-prediction-view="table">予測出庫数</button>
          <button type="button" class="sub-tab active" data-prediction-view="chart">出庫予測グラフ</button>
        </div>
        <div id="predictionTableView" class="prediction-view">
          <div id="predictionTable" class="table-wrap"></div>
        </div>
        <div id="predictionChartView" class="prediction-view active">
          <div class="chart-box"><canvas id="predictionChart" role="img" aria-label="出庫予測と保管数の推移"></canvas></div>
        </div>
      </div>
    </section>

    <section id="masterPanel" class="panel" data-panel="master">
      <div class="section-title">
        <h2>マスタ</h2>
        <button id="masterSaveBtn" type="button"><i data-lucide="save"></i><span>確定</span></button>
      </div>
      <p class="hint">一覧の変更は「確定」を押すまでSupabaseに反映しません。使用中の室名・種別・保管種別は削除できません。</p>
      <div id="masterRooms" class="master-view active"></div>
    </section>
  </main>

  <dialog id="graphFullscreenDialog" class="graph-fullscreen-dialog" aria-label="入出庫・在庫グラフの全画面表示"></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="./app.js?v=20260914-five-series"></script>
</body>
</html>
